name: Build and Push Docker Container to ACR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  AZURE_CONTAINER_REGISTRY: campusosacr24026
  CONTAINER_NAME: campusos
  RESOURCE_GROUP: Cloud
  WEBAPP_NAME: campusos-sasank

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Azure Container Registry (ACR)
      uses: azure/docker-login@v2
      with:
        login-server: campusosacr24026.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          campusosacr24026.azurecr.io/campusos:latest
          campusosacr24026.azurecr.io/campusos:${{ github.sha }}

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy Container to Azure App Service
      uses: azure/webapps-deploy@v3
      with:
        app-name: campusos-sasank
        images: 'campusosacr24026.azurecr.io/campusos:latest'
